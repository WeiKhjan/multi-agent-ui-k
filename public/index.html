<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI_K — Multi-Agent Terminal</title>
  <link rel="stylesheet" href="/css/terminal.css">
</head>
<body>
  <div class="app-container">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1 class="glow">UI_K TERMINAL</h1>
        <div class="subtitle">Vault &amp; Reasoning</div>
      </div>

      <!-- Agent Status -->
      <div class="agent-status">
        <div class="agent-indicator" id="vault-status">
          <span class="dot offline" id="vault-dot"></span>
          <span class="name vault">Vault</span>
          <span class="status-text" id="vault-status-text">offline</span>
        </div>
        <div class="agent-indicator" id="brain-status">
          <span class="dot offline" id="brain-dot"></span>
          <span class="name brain">Brain</span>
          <span class="status-text" id="brain-status-text">offline</span>
        </div>
      </div>

      <!-- Room List -->
      <div class="room-list" id="room-list">
        <!-- Populated by JS -->
      </div>

      <!-- New Room Button -->
      <button class="new-room-btn" id="new-room-btn">+ NEW ROOM</button>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">

      <!-- Welcome Screen (shown when no room selected) -->
      <div class="welcome-screen" id="welcome-screen">
        <div class="logo">UI_K TERMINAL v1.0</div>
        <div class="tagline">Select a room to begin</div>
        <div class="tagline" style="font-size: 13px; margin-top: 8px;">
          &#x1F512; Vault &nbsp;|&nbsp; &#x1F4AC; Shared &nbsp;|&nbsp; &#x1F6E0; Ops &nbsp;|&nbsp; &#x1F4CB; Client
        </div>
      </div>

      <!-- Chat View (hidden until room selected) -->
      <div id="chat-view" style="display: none; flex: 1; flex-direction: column; overflow: hidden;">

        <!-- Chat Header -->
        <div class="chat-header" id="chat-header">
          <span class="room-type-icon" id="room-type-icon"></span>
          <span class="room-title" id="room-title">—</span>
          <span class="room-description" id="room-description"></span>
          <button class="search-btn" id="search-toggle-btn">SEARCH</button>
        </div>

        <!-- Search Bar -->
        <div class="search-bar" id="search-bar">
          <input type="text" id="search-input" placeholder="Search messages...">
          <button class="close-search" id="close-search">&times;</button>
        </div>

        <!-- Messages -->
        <div class="messages-container" id="messages-container">
          <!-- Populated by JS -->
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typing-indicator"></div>

        <!-- Input Area -->
        <div class="input-area">
          <span class="prompt-symbol">&gt;</span>
          <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
          <button class="file-btn" id="file-btn" title="Attach file">&#x1F4CE;</button>
          <button class="send-btn" id="send-btn">SEND</button>
        </div>
      </div>
    </main>
  </div>

  <!-- New Room Modal -->
  <div class="modal-overlay" id="new-room-modal">
    <div class="modal">
      <h2>CREATE NEW ROOM</h2>
      <label for="room-name-input">Room Name</label>
      <input type="text" id="room-name-input" placeholder="e.g., Client ABC Workspace">
      <label for="room-type-select">Room Type</label>
      <select id="room-type-select">
        <option value="ops">&#x1F6E0; Ops (No client data)</option>
        <option value="shared">&#x1F4AC; Shared (Auto-masked)</option>
        <option value="vault">&#x1F512; Vault (Real data, Brain blocked)</option>
        <option value="client">&#x1F4CB; Client (Real data, per-client)</option>
      </select>
      <label for="room-desc-input">Description (optional)</label>
      <input type="text" id="room-desc-input" placeholder="Brief description...">
      <div class="modal-actions">
        <button class="btn" id="cancel-room-btn">CANCEL</button>
        <button class="btn primary" id="create-room-btn">CREATE</button>
      </div>
    </div>
  </div>

  <!-- Hidden file input -->
  <input type="file" id="file-input" style="display: none;">

  <!-- Socket.IO Client -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- App Modules -->
  <script src="/js/socket-handler.js"></script>
  <script src="/js/room-ui.js"></script>
  <script src="/js/message-ui.js"></script>
  <script src="/js/file-handler.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
